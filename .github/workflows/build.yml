# Автосборка мода: запускается при каждой загрузке файлов в репозиторий
# и вручную кнопкой «Run workflow» на вкладке Actions.
name: build
on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: astanaclock-mod
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
      - name: publish release with the mod jar
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JAR=$(ls build/libs/astanaclock-*.jar | grep -v -- '-sources')
          echo "Mod jar: $JAR"
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest "$JAR" --target "${{ github.sha }}" \
            --title "Astana Clock (последняя сборка)" \
            --notes "Готовый мод для Minecraft 1.21.11 (Fabric). Нужен Fabric API 0.141.6+1.21.11."
